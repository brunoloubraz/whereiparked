name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: ./mvnw -B --no-transfer-progress clean verify

  javascript-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: JavaScript tests
        run: node --test src/test/js/*.test.cjs

  docker-check:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t whereiparked:ci .
      - name: Start container
        run: >-
          docker run -d --name whereiparked-ci
          -p 127.0.0.1:8080:8080 -e PORT=8080
          -e GEOCODING_USER_AGENT= whereiparked:ci
      - name: HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 60 --retry-delay 2 \
            --retry-connrefused --retry-all-errors --max-time 3 \
            http://127.0.0.1:8080/ -o /tmp/whereiparked-index.html
          cmp src/main/resources/static/index.html /tmp/whereiparked-index.html
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:8080/js/app.js -o /tmp/whereiparked-app.js
          cmp src/main/resources/static/js/app.js /tmp/whereiparked-app.js
          status=$(curl --silent --show-error --max-time 10 -o /tmp/whereiparked-error.json \
            -w '%{http_code}' 'http://127.0.0.1:8080/api/location/reverse?lat=invalid&lon=0')
          test "$status" = 400
          test "$(docker exec whereiparked-ci id -u)" != 0
      - name: Container logs on failure
        if: failure()
        run: docker logs whereiparked-ci
      - name: Stop container
        if: always()
        run: docker rm -f whereiparked-ci
