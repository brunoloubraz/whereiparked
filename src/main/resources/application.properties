spring.application.name=whereiparked

# Real requests require an application-specific identifier and maintainer contact.
geocoding.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
geocoding.user-agent=${GEOCODING_USER_AGENT:}
geocoding.connect-timeout=${GEOCODING_CONNECT_TIMEOUT:2s}
geocoding.read-timeout=${GEOCODING_READ_TIMEOUT:5s}
geocoding.cache-ttl=${GEOCODING_CACHE_TTL:5m}

# Spring HTTP debug output can contain request URLs (and precise coordinates).
logging.level.org.springframework.web=OFF
logging.level.org.springframework.http=OFF
