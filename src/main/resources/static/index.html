<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Where I Parked</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <svg class="location-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z" />
        <circle cx="12" cy="10" r="2.5" />
      </svg>
      <h1>Where I Parked</h1>
    </header>

    <main class="map-panel" aria-label="Mapa e localização">
      <div id="map" role="region" aria-label="Mapa interativo" aria-describedby="location-status"></div>
      <p id="location-status" class="map-status" role="status" aria-live="polite">Carregando mapa...</p>
      <p id="map-error" class="map-status" role="status" aria-live="polite" hidden></p>
      <noscript>Ative o JavaScript para visualizar o mapa e obter sua localização.</noscript>
    </main>

    <footer class="page-footer">
      <button id="park-button" class="park-button" type="button" aria-describedby="parking-status location-status" disabled>Parked</button>
      <p id="parking-status" class="map-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </footer>
  </body>
</html>
